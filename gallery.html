<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Summa Gallery ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{background:#fff0f3;min-height:100vh;overflow-x:hidden;text-align:center;color:#b03045;position:relative;}

/* Floating Hearts */
.bg-heart{position:fixed;font-size:20px;opacity:0.2;animation:floatUp linear infinite;pointer-events:none;}
@keyframes floatUp{from{transform:translateY(100vh);}to{transform:translateY(-120vh);}}

/* Card */
.card{max-width:900px;margin:50px auto;background:white;border-radius:25px;padding:40px;box-shadow:0 20px 40px rgba(0,0,0,0.15);animation:fadeIn 2s ease;position:relative;overflow:hidden;}

/* Titles */
h1{font-size:3rem;margin-bottom:10px;animation:float 3s infinite;text-shadow:0 0 10px #ff9db0;}
h2{font-weight:400;margin-bottom:30px;}

/* Gallery + Text Section */
.gallery-text{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin-top:30px;}
.gallery-text .pic{height:250px;border-radius:15px;overflow:hidden;box-shadow:0 10px 20px rgba(0,0,0,0.15);cursor:pointer;transition:0.4s;}
.gallery-text .pic img{width:100%;height:100%;object-fit:cover;}
.gallery-text .pic:hover{transform:scale(1.08);}
.gallery-text .text{font-size:1.1rem;line-height:1.6;text-align:left;padding:10px;}

/* Lightbox */
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:1000;}
.lightbox img{max-width:90%;max-height:90%;border-radius:20px;}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
@keyframes float{0%{transform:translateY(0);}50%{transform:translateY(-8px);}100%{transform:translateY(0);}}
.heart{position:fixed;font-size:18px;color:#ff4d6d;animation:heartMove 1.5s linear forwards;pointer-events:none;}
@keyframes heartMove{from{opacity:1;}to{opacity:0;transform:translateY(-80px) scale(0.3);}}

/* Lyrics */
.lyric{position:fixed;font-size:32px;font-family:'Dancing Script', cursive;color:#b03045;font-weight:700;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:28%;white-space:pre-wrap;word-wrap:break-word;text-shadow:2px 2px 8px #ffc0cb;}
.lyric.left{left:10%;top:50%;transform:translateY(-50%);}
.lyric.right{right:10%;top:50%;transform:translateY(-50%);}
</style>
</head>

<body>

<div class="card">
<h1>💖 Gallery of Love 💖</h1>
<h2>Summa 💕</h2>

<div class="gallery-text">
  <div class="pic" onclick="openLightbox('pic1.png')"><img src="pic1.png"></div>
  <div class="text">Your eyes are so beautiful, how am I not supposed to fall in love with it</div>

  <div class="pic" onclick="openLightbox('pic2.png')"><img src="pic2.png"></div>
  <div class="text">One of the best pictures of you, I fall in love more as I look at it, it's just perfect overall, you are perfect</div>

  <div class="pic" onclick="openLightbox('pic3.png')"><img src="pic3.png"></div>
  <div class="text">I love you boiii, I hope this lasts forever</div>
</div>

<button class="btn" onclick="showLove()">Click Me 😘</button>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<!-- Lyrics -->
<div class="lyric left" id="lyric-left"></div>
<div class="lyric right" id="lyric-right"></div>

<!-- Music -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
let music = document.getElementById("music");
let playing = false;

/* Floating Background Hearts */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="bg-heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=5+Math.random()*5+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},600);

/* Cursor Hearts */
let lastHeart=0;
document.addEventListener("mousemove",e=>{
  let now=Date.now();
  if(now-lastHeart<150) return;
  lastHeart=now;
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=e.clientX+"px";
  h.style.top=e.clientY+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1500);
});

/* Lightbox */
function openLightbox(src){
  document.getElementById("lightboxImg").src=src;
  document.getElementById("lightbox").style.display="flex";
}
function closeLightbox(){document.getElementById("lightbox").style.display="none";}

/* Button popup */
function showLove(){ alert("BOOMSHAKALAKA 💥❤️"); }

/* Start music automatically */
if(!playing){
  music.play().catch(e=>{});
  playing=true;
}

/* Lyrics sync */
const lyrics = [
  [1.0, 3.0, "I don't wanna get lost"],
  [3.5, 6.0, "inside the color"],
  [6.3, 9.0, "under my tongue"],
  [10.7, 14.9, "Cause I don't wanna\nbe in love with another"],
  [15.0, 20.0, "even in another life"],
  [20.5, 24.9, "Can someone tell me\nit's alright to be covered"],
  [25.0, 29.0, "Underneath the covers?\nBut I"],
  [29.1, 33.5, "No, I don't need to\nsleep anymore"]
];

let lyricIndex = 0;
const leftEl = document.getElementById("lyric-left");
const rightEl = document.getElementById("lyric-right");

function updateLyrics(){
  const currentTime = music.currentTime;
  let found = false;
  lyrics.forEach((line,i)=>{
    if(currentTime>=line[0] && currentTime<=line[1]){
      if(i!==lyricIndex){
        lyricIndex = i;
        const el = i%2===0 ? leftEl : rightEl;
        const other = i%2===0 ? rightEl : leftEl;
        el.innerText = line[2];
        el.style.opacity = 1;
        other.style.opacity = 0;
      }
      found = true;
    }
  });
  if(!found){ leftEl.style.opacity=0; rightEl.style.opacity=0; }
  requestAnimationFrame(updateLyrics);
}

music.addEventListener('ended',()=>{
  music.currentTime=0;
  lyricIndex=0;
  music.play().catch(e=>{});
});

requestAnimationFrame(updateLyrics);
</script>
</body>
</html>
