<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Summa ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins",sans-serif;
}

body{
  background:#fff0f3;
  min-height:100vh;
  text-align:center;
  color:#b03045;
  overflow-x:hidden;
}

/* Overlay */
#overlay{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#ff9db0,#fff0f3);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#overlay button{
  padding:20px 40px;
  font-size:24px;
  border:none;
  border-radius:25px;
  background:#ff6b81;
  color:white;
  cursor:pointer;
  margin-top:20px;
  transition:.3s;
}

#overlay button:hover{
  background:#ff4d6d;
  transform:scale(1.05);
}

/* Card */
.card{
  max-width:900px;
  margin:50px auto;
  background:white;
  border-radius:25px;
  padding:40px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  display:none;
  animation:fade 1.5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}

/* Titles */

h1{
  font-size:3rem;
  text-shadow:0 0 10px pink;
  animation:float 3s infinite;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
  100%{transform:translateY(0);}
}

.message{
  line-height:1.8;
  margin:30px 0;
}

/* Featured */

.featured{
  width:100%;
  height:230px;
  margin:30px 0;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 25px rgba(0,0,0,.15);
  cursor:pointer;
}

.featured img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.featured:hover img{
  transform:scale(1.08);
}

/* Gallery */

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin:40px 0;
}

.pic{
  height:200px;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(0,0,0,.15);
  transition:.4s;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.pic:hover{
  transform:scale(1.08);
}

/* Button */

.btn{
  background:#ff6b81;
  color:white;
  border:none;
  padding:12px 30px;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  background:#ff4d6d;
  transform:scale(1.08);
}

/* Lightbox */

.lightbox{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:20px;
}

/* Floating hearts */

.bg-heart{
  position:fixed;
  font-size:20px;
  opacity:.2;
  animation:floatUp linear infinite;
  pointer-events:none;
}

@keyframes floatUp{
  from{transform:translateY(100vh);}
  to{transform:translateY(-120vh);}
}

/* Cursor hearts */

.heart{
  position:fixed;
  font-size:18px;
  color:#ff4d6d;
  animation:heartMove 1.5s linear forwards;
  pointer-events:none;
}

@keyframes heartMove{
  to{
    opacity:0;
    transform:translateY(-80px) scale(.3);
  }
}

/* Lyrics */

.lyric{
  position:fixed;
  font-family:'Dancing Script', cursive;
  color:#b03045;
  font-weight:700;
  opacity:0;
  transition:.4s;
  pointer-events:none;
  white-space:pre-wrap;
  text-shadow:0 0 15px pink,0 0 30px #ff9db0;
}

/* Side */

.lyric.left{
  left:8%;
  top:50%;
  transform:translateY(-50%);
  font-size:32px;
  max-width:28%;
}

.lyric.right{
  right:8%;
  top:50%;
  transform:translateY(-50%);
  font-size:32px;
  max-width:28%;
}

/* Center */

.lyric.center{
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:64px;
  text-align:center;
  max-width:85%;

  font-family:'Playfair Display', serif;

  background:rgba(255,255,255,0.75);
  padding:40px 50px;
  border-radius:25px;

  box-shadow:
    0 0 30px rgba(255,105,135,0.6),
    0 0 60px rgba(255,180,200,0.5);

  backdrop-filter:blur(8px);

  opacity:0;
  animation:fadeCenter 1.2s ease forwards;
}

@keyframes fadeCenter{
  from{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.9);
  }
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

</style>
</head>

<body>

<!-- Overlay -->

<div id="overlay">
  <h1>💖 Welcome 💖</h1>
  <button onclick="start()">Open ❤️</button>
</div>

<!-- Music -->

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Main -->

<div class="card">

<h1>💖 Happy Valentine’s Day 💖</h1>
<h2>Summa 💕</h2>

<div class="message">

<p>You are everything to me ❤️</p>
<p>I’m grateful to have you in my life.</p>
<p>I love you so much.</p>

<p style="font-weight:600;margin-top:20px;">
YOU ARE MY E-VALENTINE ❤️
</p>

<p>— Your Winta 💘</p>

</div>

<div class="featured" onclick="openBox('photo4.png')">
  <img src="photo4.png">
</div>

<div class="gallery">

  <div class="pic" onclick="openBox('photo1.png')">
    <img src="photo1.png">
  </div>

  <div class="pic" onclick="openBox('photo2.png')">
    <img src="photo2.png">
  </div>

  <div class="pic" onclick="openBox('photo3.png')">
    <img src="photo3.png">
  </div>

</div>

<button class="btn" onclick="boom()">Click Me 😘</button>

</div>

<!-- Lightbox -->

<div class="lightbox" id="box" onclick="closeBox()">
  <img id="boxImg">
</div>

<!-- Lyrics -->

<div class="lyric left" id="left"></div>
<div class="lyric right" id="right"></div>

<script>

/* Music */

const music = document.getElementById("music");

let playing=false;

/* Lyrics */

const lyrics = [

  [1,3,"I don't wanna get lost","side"],
  [3.5,6,"inside the color","side"],
  [6.3,9,"under my tongue","side"],

  [10.7,14.9,"Cause I don't wanna\nbe in love with another","side"],

  [15,20,"EVEN IN\nANOTHER LIFEE ❤️✨","center"],

  [20.5,24.9,"Can someone tell me\nit's alright to be covered","side"],
  [25,29,"Underneath the covers?\nBut I","side"],
  [29.1,33.5,"No, I don't need to\nsleep anymore","side"]

];

let index=-1;

const left=document.getElementById("left");
const right=document.getElementById("right");

/* Lyrics sync */

function sync(){

  const t = music.currentTime;

  let active=false;

  lyrics.forEach((l,i)=>{

    if(t>=l[0] && t<=l[1]){

      active=true;

      if(i!==index){

        index=i;

        left.className="lyric left";
        right.className="lyric right";

        left.style.opacity=0;
        right.style.opacity=0;

        if(l[3]==="center"){

          left.className="lyric center";
          left.innerText=l[2];
          left.style.opacity=1;

        }else{

          const el = i%2===0 ? left : right;
          const other = i%2===0 ? right : left;

          el.innerText=l[2];
          el.style.opacity=1;
          other.style.opacity=0;
        }
      }
    }

  });

  if(!active){
    left.style.opacity=0;
    right.style.opacity=0;
  }

  requestAnimationFrame(sync);
}

/* Start */

function start(){

  document.getElementById("overlay").style.display="none";
  document.querySelector(".card").style.display="block";

  if(!playing){
    music.play().catch(()=>{});
    playing=true;
  }
}

/* Lightbox */

function openBox(src){
  document.getElementById("boxImg").src=src;
  document.getElementById("box").style.display="flex";
}

function closeBox(){
  document.getElementById("box").style.display="none";
}

/* Button */

function boom(){
  alert("BOOMSHAKALAKA 💥❤️");
}

/* Floating hearts */

setInterval(()=>{

  const h=document.createElement("div");
  h.className="bg-heart";
  h.innerHTML="❤️";

  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=5+Math.random()*5+"s";

  document.body.appendChild(h);

  setTimeout(()=>h.remove(),10000);

},600);

/* Cursor hearts */

let last=0;

document.addEventListener("mousemove",e=>{

  const now=Date.now();

  if(now-last<150) return;

  last=now;

  const h=document.createElement("div");

  h.className="heart";
  h.innerHTML="❤️";

  h.style.left=e.clientX+"px";
  h.style.top=e.clientY+"px";

  document.body.appendChild(h);

  setTimeout(()=>h.remove(),1500);

});

/* Loop */

music.addEventListener("ended",()=>{

  music.currentTime=0;
  index=-1;
  music.play();

});

requestAnimationFrame(sync);

</script>

</body>
</html>
