<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins",sans-serif;
}

body{
  background:linear-gradient(135deg,#2b1638,#3d1f4d,#1f1028);
  min-height:100vh;
  overflow-x:hidden;
  color:#ffd8f0;
  text-align:center;
}

/* OVERLAY */
#overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#241030,#17081f);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  padding:20px;
}

#overlay h1{
  font-size:2.3rem;
  margin-bottom:25px;
}

#overlay button{
  padding:18px 42px;
  border:none;
  border-radius:30px;
  font-size:22px;
  background:#ff8cc6;
  color:white;
  cursor:pointer;
  box-shadow:0 0 25px #ff8cc6;
}

/* CARD */
.card{
  display:none;
  max-width:950px;
  margin:50px auto;
  background:#24112f;
  border-radius:28px;
  padding:40px;
  box-shadow:0 0 40px rgba(255,170,220,0.18);
}

h1{
  font-size:3rem;
  text-shadow:0 0 20px #ff8cc6;
}

h2{
  margin-top:10px;
  font-weight:400;
  margin-bottom:35px;
}

/* MESSAGE */
.message{
  font-size:1.1rem;
  line-height:1.9;
  margin-bottom:40px;
}

/* FEATURED */
.featured{
  width:100%;
  height:260px;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:30px;
  cursor:pointer;
}

.featured img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  margin-bottom:50px;
}

.pic{
  height:220px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.4s;
}

.pic img:hover{
  transform:scale(1.05);
}

/* SIDE SECTION */
.side-gallery{
  display:flex;
  flex-direction:column;
  gap:45px;
}

.side-pic{
  display:flex;
  align-items:center;
  gap:25px;
  flex-wrap:wrap;
}

.img-container{
  flex:1;
  max-width:40%;
  cursor:pointer;
}

.img-container img{
  width:100%;
  border-radius:18px;
  transition:0.3s;
}

.img-container img:hover{
  transform:scale(1.05);
}

.side-text{
  flex:1;
  text-align:left;
  font-size:1.05rem;
  line-height:1.8;
}

/* BUTTON */
.btn{
  margin-top:50px;
  padding:14px 34px;
  border:none;
  border-radius:30px;
  background:#ff8cc6;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:20px;
}

/* FLOAT */
.bg-heart{
  position:fixed;
  font-size:20px;
  pointer-events:none;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{transform:translateY(110vh);opacity:0;}
  to{transform:translateY(-120vh);opacity:1;}
}

.heart{
  position:fixed;
  font-size:18px;
  pointer-events:none;
  animation:pop 1s linear forwards;
}

@keyframes pop{
  to{opacity:0;transform:translateY(-60px) scale(0.2);}
}

</style>
</head>

<body>

<div id="overlay">
  <h1>💖 made for Zoe 💖</h1>
  <button onclick="start()">Open ✨</button>
</div>

<audio id="music" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="card">

<h1>💖 Zoe 💖</h1>
<h2>you mean everything ✨</h2>

<div class="message">
<p>You make my life better 💕</p><br>
<p>I love everything about you.</p><br>
<p>Your smile, your eyes, your energy 💖</p><br>
<p>You’re my favorite person ✨</p><br>
<p><b>always you ❤️</b></p>
</div>

<!-- FEATURED -->
<div class="featured" onclick="openLightbox('pic4.png')">
  <img src="pic4.png">
</div>

<!-- GALLERY -->
<div class="gallery">

  <div class="pic" onclick="openLightbox('pic1.png')">
    <img src="pic1.png">
  </div>

  <div class="pic" onclick="openLightbox('pic2.png')">
    <img src="pic2.png">
  </div>

  <div class="pic" onclick="openLightbox('pic3.png')">
    <img src="pic3.png">
  </div>

</div>

<!-- SIDE -->
<div class="side-gallery">

  <div class="side-pic">
    <div class="img-container" onclick="openLightbox('pic1.png')">
      <img src="pic1.png">
    </div>
    <div class="side-text">you look so pretty here 💖</div>
  </div>

  <div class="side-pic">
    <div class="img-container" onclick="openLightbox('pic2.png')">
      <img src="pic2.png">
    </div>
    <div class="side-text">I love this one so much 😭💖</div>
  </div>

  <div class="side-pic">
    <div class="img-container" onclick="openLightbox('pic3.png')">
      <img src="pic3.png">
    </div>
    <div class="side-text">you’re literally perfect ❤️</div>
  </div>

</div>

<button class="btn" onclick="showLove()">click me 💌</button>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script>

const music = document.getElementById("music");

function start(){
  document.getElementById("overlay").style.display="none";
  document.querySelector(".card").style.display="block";
  music.play();
}

function openLightbox(src){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightboxImg").src=src;
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

function showLove(){
  alert("I just wanna stay with you always 💖");
}

/* hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="bg-heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},400);

document.addEventListener("mousemove",e=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=e.clientX+"px";
  h.style.top=e.clientY+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1000);
});

</script>

</body>
</html>
