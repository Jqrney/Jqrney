<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Summa ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins",sans-serif;
}

/* BODY - lighter background */
body{
  background:linear-gradient(135deg,#3a001a,#5a0025,#2a000f);
  min-height:100vh;
  overflow-x:hidden;
  text-align:center;
  color:#ffb3c1;
  position:relative;
}

/* OVERLAY */
#overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#400018,#300010);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

#overlay button{
  padding:18px 40px;
  font-size:24px;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
  box-shadow:0 0 25px #ff4d6d;
  transition:0.3s;
}

#overlay button:hover{
  transform:scale(1.1);
}

/* CARD */
.card{
  max-width:900px;
  margin:50px auto;
  background:#19000a;
  border-radius:25px;
  padding:40px;
  box-shadow:0 0 40px rgba(255,80,120,0.4);
  display:none;
}

/* TITLES */
h1{
  font-size:3rem;
  margin-bottom:10px;
  text-shadow:0 0 20px #ff4d6d;
}

h2{
  font-weight:400;
  margin-bottom:30px;
}

/* MESSAGE */
.message{
  font-size:1.1rem;
  line-height:1.8;
  margin:30px 0;
}

/* FEATURED */
.featured{
  width:100%;
  height:230px;
  margin:30px 0;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
}

.featured img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TOP GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin:40px 0;
}

.pic{
  height:200px;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 0 15px rgba(255,80,120,0.3);
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* SIDE GALLERY */
.side-gallery{
  margin:80px 0 40px;
  display:flex;
  flex-direction:column;
  gap:50px;
  border-top:2px solid #ff4d6d;
  padding-top:40px;
}

.side-pic{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.img-container{
  flex:1;
  max-width:40%;
  cursor:pointer;
}

.img-container img{
  width:100%;
  border-radius:15px;
  transition:0.4s;
}

/* HOVER: zoom remains, glow removed */
.img-container img:hover{
  transform: scale(1.08);
}

/* SIDE TEXT */
.side-text{
  flex:1;
  min-width:200px;
  text-align:left;
  font-size:1.1rem;
  font-weight:500;
}

/* BUTTON */
.btn{
  background:#ff4d6d;
  color:white;
  border:none;
  padding:12px 30px;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  margin-top:20px;
  box-shadow:0 0 15px #ff4d6d;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:20px;
}

/* GLOW HEARTS */
.bg-heart{
  position:fixed;
  font-size:22px;
  color:#ff4d6d;
  opacity:0.7;
  animation:floatUp linear infinite;
  pointer-events:none;
  text-shadow:
    0 0 5px #ff4d6d,
    0 0 15px #ff4d6d,
    0 0 30px #ff758f;
}

@keyframes floatUp{
  from{
    transform:translateY(110vh) scale(0.6);
    opacity:0;
  }
  to{
    transform:translateY(-120vh) scale(1.2);
    opacity:1;
  }
}

/* CURSOR HEART */
.heart{
  position:fixed;
  font-size:18px;
  color:#ff4d6d;
  animation:heartMove 1.2s linear forwards;
  pointer-events:none;
  text-shadow:0 0 10px #ff4d6d;
}

@keyframes heartMove{
  from{opacity:1;}
  to{
    opacity:0;
    transform:translateY(-80px) scale(0.3);
  }
}

/* LOCKED LYRICS */
.lyric{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  font-size:32px;
  font-family:'Dancing Script', cursive;
  font-weight:700;
  color:#ffb3c1;
  text-shadow:0 0 15px #ff4d6d;
  max-width:28%;
  opacity:0;
  transition:opacity 0.4s;
  pointer-events:none;
}

.lyric.left{left:5%;}
.lyric.right{right:5%;}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
  <h1>💖 Welcome 💖</h1>
  <button onclick="start()">Open ❤️</button>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- CARD -->
<div class="card">

<h1>💖 Happy Valentine’s Day 💖</h1>
<h2>Summa 💕</h2>

<div class="message">
<p>You are everything in my life ❤️</p><br>
<p>I’m so grateful to have you in 2026.</p><br>
<p>I love you more every day 💖</p><br>
<p><b>YOU ARE MY E-VALENTINE ❤️</b></p>
<p>— Your Winta 💘</p>
</div>

<!-- FEATURED -->
<div class="featured" onclick="openLightbox('photo4.png')">
  <img src="photo4.png">
</div>

<!-- TOP GALLERY -->
<div class="gallery">
  <div class="pic" onclick="openLightbox('photo1.png')"><img src="photo1.png"></div>
  <div class="pic" onclick="openLightbox('photo2.png')"><img src="photo2.png"></div>
  <div class="pic" onclick="openLightbox('photo3.png')"><img src="photo3.png"></div>
</div>

<!-- SIDE GALLERY -->
<div class="side-gallery">

  <div class="side-pic">
    <div class="img-container" onclick="openLightbox('pic1.png')">
      <img src="pic1.png">
    </div>
    <div class="side-text">
      Your eyes are so beautiful 😍
    </div>
  </div>

  <div class="side-pic">
    <div class="img-container" onclick="openLightbox('pic2.png')">
      <img src="pic2.png">
    </div>
    <div class="side-text">
      One of the most beautiful pictures 💖
    </div>
  </div>

  <div class="side-pic">
    <div class="img-container" onclick="openLightbox('pic3.png')">
      <img src="pic3.png">
    </div>
    <div class="side-text">
      YESSS I LOVE YOU ❤️🔥
    </div>
  </div>

</div>

<button class="btn" onclick="showLove()">Click Me 😘</button>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<!-- LYRICS -->
<div class="lyric left" id="leftLyric"></div>
<div class="lyric right" id="rightLyric"></div>

<script>

/* START */
const music = document.getElementById("music");

function start(){
  document.getElementById("overlay").style.display="none";
  document.querySelector(".card").style.display="block";
  music.play();
}

/* LIGHTBOX */
function openLightbox(src){
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").style.display="flex";
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

/* LOVE */
function showLove(){
  alert("BOOMSHAKALAKA 💥❤️");
}

/* FLOAT HEARTS */
setInterval(()=>{
  const h = document.createElement("div");
  h.className="bg-heart";
  h.innerHTML="❤️";

  h.style.left = Math.random()*100+"vw";
  h.style.animationDuration = 6 + Math.random()*5 + "s";

  document.body.appendChild(h);

  setTimeout(()=>h.remove(),12000);
},500);

/* CURSOR HEART */
let last = 0;

document.addEventListener("mousemove",e=>{
  let now = Date.now();
  if(now-last<120) return;
  last = now;

  const h = document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";

  h.style.left = e.clientX+"px";
  h.style.top = e.clientY+"px";

  document.body.appendChild(h);

  setTimeout(()=>h.remove(),1200);
});

/* LYRICS */
const lyrics = [
  [1,3,"I don't wanna get lost"],
  [3.5,6,"inside the color"],
  [6.3,9,"under my tongue"],
  [10.7,15,"Cause I don't wanna\nbe in love with another"],
  [15,20,"even in another life"],
  [20.5,25,"Can someone tell me\nit's alright"],
  [25,29,"Underneath the covers"],
  [29,34,"No, I don't need to sleep"]
];

let index = -1;

const left = document.getElementById("leftLyric");
const right = document.getElementById("rightLyric");

function syncLyrics(){

  const t = music.currentTime;

  let active = false;

  lyrics.forEach((l,i)=>{
    if(t>=l[0] && t<=l[1]){

      if(i!==index){

        index = i;

        const show = i%2===0 ? left : right;
        const hide = i%2===0 ? right : left;

        show.innerText = l[2];
        show.style.opacity = 1;
        hide.style.opacity = 0;
      }

      active = true;
    }
  });

  if(!active){
    left.style.opacity=0;
    right.style.opacity=0;
  }

  requestAnimationFrame(syncLyrics);
}

requestAnimationFrame(syncLyrics);

</script>
</body>
</html>
