<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Summa ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins",sans-serif;
}

body{
  background:#fff0f3;
  min-height:100vh;
  text-align:center;
  color:#b03045;
  overflow-x:hidden;
}

/* Overlay */
#overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#ff9db0,#fff0f3);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#overlay button{
  padding:20px 40px;
  font-size:24px;
  border:none;
  border-radius:25px;
  background:#ff6b81;
  color:white;
  cursor:pointer;
  margin-top:20px;
  transition:.3s;
}

#overlay button:hover{
  background:#ff4d6d;
  transform:scale(1.05);
}

/* Card */
.card{
  max-width:900px;
  margin:50px auto;
  background:white;
  border-radius:25px;
  padding:40px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  display:none;
  animation:fade 1.5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}

/* Titles */

h1{
  font-size:3rem;
  text-shadow:0 0 10px pink;
}

/* Button */

.btn{
  background:#ff6b81;
  color:white;
  border:none;
  padding:12px 30px;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  background:#ff4d6d;
  transform:scale(1.08);
}

/* Floating hearts */

.bg-heart{
  position:fixed;
  font-size:20px;
  opacity:.2;
  animation:floatUp linear infinite;
  pointer-events:none;
}

@keyframes floatUp{
  from{transform:translateY(100vh);}
  to{transform:translateY(-120vh);}
}

/* Cursor hearts */

.heart{
  position:fixed;
  font-size:18px;
  color:#ff4d6d;
  animation:heartMove 1.5s linear forwards;
  pointer-events:none;
}

@keyframes heartMove{
  to{
    opacity:0;
    transform:translateY(-80px) scale(.3);
  }
}

/* CENTER LYRICS */

.lyric{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  font-family:'Playfair Display', serif;
  font-size:48px;
  text-align:center;
  max-width:85%;

  background:rgba(255,255,255,0.8);
  padding:35px 45px;
  border-radius:25px;

  box-shadow:0 0 30px rgba(255,120,150,.6);

  backdrop-filter:blur(8px);

  opacity:0;
  pointer-events:none;

  transition:opacity 1s ease;
}

.lyric.show{
  opacity:1;
}

</style>
</head>

<body>

<!-- Overlay -->

<div id="overlay">
  <h1>💖 Welcome 💖</h1>
  <button onclick="start()">Open ❤️</button>
</div>

<!-- Music -->

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Main -->

<div class="card">

<h1>💖 Happy Valentine’s Day 💖</h1>
<h2>Summa 💕</h2>

<p>You are everything to me ❤️</p>
<p>I love you so much.</p>

<p style="font-weight:600;margin:20px 0;">
YOU ARE MY E-VALENTINE ❤️
</p>

<p>— Your Winta 💘</p>

<button class="btn" onclick="boom()">Click Me 😘</button>

</div>

<!-- Lyrics -->

<div class="lyric" id="lyricBox"></div>

<script>

const music = document.getElementById("music");
const lyricBox = document.getElementById("lyricBox");

let playing=false;
let index=-1;

/* Lyrics timing */

const lyrics = [

  [1,3,"I don't wanna get lost"],
  [3.5,6,"inside the color"],
  [6.3,9,"under my tongue"],

  [10.7,14.9,"Cause I don't wanna\nbe in love with another"],

  [15,20,"EVEN IN\nANOTHER LIFEE ❤️✨"],

  [20.5,24.9,"Can someone tell me\nit's alright to be covered"],
  [25,29,"Underneath the covers?\nBut I"],
  [29.1,33.5,"No, I don't need to\nsleep anymore"]

];

/* Sync */

function sync(){

  const t = music.currentTime;

  let active=false;

  lyrics.forEach((l,i)=>{

    if(t>=l[0] && t<=l[1]){

      active=true;

      if(i!==index){

        index=i;

        lyricBox.classList.remove("show");

        setTimeout(()=>{

          lyricBox.innerText=l[2];
          lyricBox.classList.add("show");

        },200);
      }
    }

  });

  if(!active){
    lyricBox.classList.remove("show");
  }

  requestAnimationFrame(sync);
}

/* Start */

function start(){

  document.getElementById("overlay").style.display="none";
  document.querySelector(".card").style.display="block";

  if(!playing){
    music.play().catch(()=>{});
    playing=true;
  }
}

/* Button */

function boom(){
  alert("BOOMSHAKALAKA 💥❤️");
}

/* Floating hearts */

setInterval(()=>{

  const h=document.createElement("div");
  h.className="bg-heart";
  h.innerHTML="❤️";

  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=5+Math.random()*5+"s";

  document.body.appendChild(h);

  setTimeout(()=>h.remove(),10000);

},600);

/* Cursor hearts */

let last=0;

document.addEventListener("mousemove",e=>{

  const now=Date.now();

  if(now-last<150) return;

  last=now;

  const h=document.createElement("div");

  h.className="heart";
  h.innerHTML="❤️";

  h.style.left=e.clientX+"px";
  h.style.top=e.clientY+"px";

  document.body.appendChild(h);

  setTimeout(()=>h.remove(),1500);

});

/* Loop */

music.addEventListener("ended",()=>{

  music.currentTime=0;
  index=-1;
  music.play();

});

requestAnimationFrame(sync);

</script>

</body>
</html>
