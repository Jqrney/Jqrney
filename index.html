<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins",sans-serif;
}

body{
  background:linear-gradient(135deg,#2b1638,#3d1f4d,#1f1028);
  min-height:100vh;
  color:#ffd8f0;
  text-align:center;
  overflow-x:hidden;
}

/* OVERLAY */
#overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#241030,#17081f);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#overlay h1{
  font-size:2.2rem;
  margin-bottom:20px;
}

#overlay button{
  padding:16px 40px;
  font-size:20px;
  border:none;
  border-radius:30px;
  background:#ff8cc6;
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px #ff8cc6;
}

/* CARD */
.card{
  display:none;
  max-width:950px;
  margin:50px auto;
  background:#24112f;
  border-radius:28px;
  padding:40px;
  box-shadow:0 0 40px rgba(255,170,220,0.2);
}

h1{
  font-size:3rem;
  text-shadow:0 0 20px #ff8cc6;
}

h2{
  font-weight:400;
  margin-bottom:30px;
}

.message{
  font-size:1.1rem;
  line-height:1.9;
  margin-bottom:40px;
}

/* FEATURE */
.featured{
  width:100%;
  height:260px;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:25px;
  cursor:pointer;
}

.featured img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* GRID */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-bottom:40px;
}

.pic{
  height:220px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.3s;
}

.pic img:hover{
  transform:scale(1.05);
}

/* BUTTON */
.btn{
  margin-top:30px;
  padding:14px 30px;
  border:none;
  border-radius:30px;
  background:#ff8cc6;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:20px;
}

/* FLOAT HEARTS */
.heart{
  position:fixed;
  font-size:18px;
  pointer-events:none;
  animation:float 1s linear forwards;
}

@keyframes float{
  to{
    opacity:0;
    transform:translateY(-60px) scale(0.2);
  }
}

.bg-heart{
  position:fixed;
  font-size:20px;
  pointer-events:none;
  animation:rise linear infinite;
}

@keyframes rise{
  from{transform:translateY(110vh);opacity:0;}
  to{transform:translateY(-120vh);opacity:1;}
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
  <h1>💖 Made for Zoe 💖</h1>
  <button onclick="start()">Open ✨</button>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- CARD -->
<div class="card">

<h1>💖 Zoe 💖</h1>
<h2>you mean everything to me ✨</h2>

<div class="message">
<p>You make my life feel better 💕</p><br>
<p>I love everything about you.</p><br>
<p>Your smile, your eyes, your vibe 💖</p><br>
<p>You’re my favorite person ✨</p><br>
<p><b>always you ❤️</b></p>
</div>

<!-- FEATURED -->
<div class="featured" onclick="openLightbox('pic 4.png')">
  <img src="pic 4.png">
</div>

<!-- GALLERY -->
<div class="gallery">

  <div class="pic" onclick="openLightbox('pic 1.png')">
    <img src="pic 1.png">
  </div>

  <div class="pic" onclick="openLightbox('pic 2.png')">
    <img src="pic 2.png">
  </div>

  <div class="pic" onclick="openLightbox('pic 3.png')">
    <img src="pic 3.png">
  </div>

  <div class="pic" onclick="openLightbox('pic 4.png')">
    <img src="pic 4.png">
  </div>

</div>

<button class="btn" onclick="showLove()">click me 💌</button>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script>

const music = document.getElementById("music");

function start(){
  document.getElementById("overlay").style.display="none";
  document.querySelector(".card").style.display="block";
  music.play();
}

function openLightbox(src){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightboxImg").src=src;
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

function showLove(){
  alert("I’m really lucky to have you Zoe 💖");
}

/* FLOATING HEARTS */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="bg-heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},400);

/* CURSOR HEARTS */
document.addEventListener("mousemove",e=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=e.clientX+"px";
  h.style.top=e.clientY+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1000);
});

</script>

</body>
</html>
