<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Summa ❤️ Page 2</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
/* --- Copy all styles from index.html here --- */
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{background:#fff0f3;min-height:100vh;overflow-x:hidden;text-align:center;color:#b03045;position:relative;scroll-behavior:smooth;}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#ff9db0,#fff0f3);display:flex;justify-content:center;align-items:center;z-index:9999;flex-direction:column;}
#overlay button{padding:20px 40px;font-size:24px;border:none;border-radius:25px;background:#ff6b81;color:white;cursor:pointer;box-shadow:0 10px 20px rgba(0,0,0,0.2);transition:0.3s;}
#overlay button:hover{background:#ff4d6d;transform:scale(1.05);}
.bg-heart{position:fixed;font-size:20px;opacity:0.2;animation:floatUp linear infinite;pointer-events:none;}
@keyframes floatUp{from{transform:translateY(100vh);}to{transform:translateY(-120vh);}}
.card{max-width:900px;margin:50px auto;background:white;border-radius:25px;padding:40px;box-shadow:0 25px 60px rgba(0,0,0,0.25);position:relative;overflow:hidden;opacity:0;transform:translateY(80px);transition:all 1s ease-out;}
.featured{width:100%;height:400px;margin:50px 0;border-radius:25px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.25);cursor:pointer;opacity:0;transform:translateX(100px);transition:all 1s ease-out;}
.featured img{width:100%;height:100%;object-fit:cover;transition:0.6s;}
.featured:hover img{transform:scale(1.1);}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;margin:40px 0;}
.pic{height:250px;border-radius:20px;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,0.25);transition:0.6s;cursor:pointer;opacity:0;transform:translateY(50px);}
.pic img{width:100%;height:100%;object-fit:cover;transition:0.6s;}
.pic:hover{transform:scale(1.05) rotate(-1deg);}
.show{opacity:1;transform:translate(0,0);}
h1{font-size:3rem;margin-bottom:10px;animation:float 3s infinite;text-shadow:0 0 15px #ff9db0;}
h2{font-weight:400;margin-bottom:30px;}
.message{font-size:1.1rem;line-height:1.8;margin:30px 0;}
.btn{background:#ff6b81;color:white;border:none;padding:14px 35px;border-radius:30px;font-size:18px;cursor:pointer;transition:0.3s;box-shadow:0 8px 20px rgba(0,0,0,0.2);}
.btn:hover{background:#ff4d6d;transform:scale(1.08);}
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:1000;}
.lightbox img{max-width:90%;max-height:90%;border-radius:25px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
@keyframes float{0%{transform:translateY(0);}50%{transform:translateY(-8px);}100%{transform:translateY(0);}}
.heart{position:fixed;font-size:18px;color:#ff4d6d;animation:heartMove 1.5s linear forwards;pointer-events:none;}
@keyframes heartMove{from{opacity:1;}to{opacity:0;transform:translateY(-80px) scale(0.3);}}
.lyric{position:fixed;font-size:32px;font-family:'Dancing Script', cursive;color:#b03045;font-weight:700;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:28%;white-space:pre-wrap;word-wrap:break-word;text-shadow:2px 2px 8px #ffc0cb;}
.lyric.left{left:10%;top:50%;transform:translateY(-50%);}
.lyric.right{right:10%;top:50%;transform:translateY(-50%);}
</style>
</head>
<body>

<div id="overlay">
  <h1>💖 Welcome to Page 2 💖</h1>
  <button onclick="startExperience()">Enter ❤️</button>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
<h1>💖 More Memories 💖</h1>
<h2>Summa 💕</h2>
<div class="message">
<p>Here’s more special moments we share…</p>
</div>

<div class="gallery">
  <div class="pic"><img src="pic1.png"></div>
  <div class="pic"><img src="pic2.png"></div>
  <div class="pic"><img src="pic3.png"></div>
</div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg"></div>
<div class="lyric left" id="lyric-left"></div>
<div class="lyric right" id="lyric-right"></div>

<script>
let music=document.getElementById("music"),playing=false;
setInterval(()=>{let h=document.createElement("div");h.className="bg-heart";h.innerHTML="❤️";h.style.left=Math.random()*100+"vw";h.style.animationDuration=5+Math.random()*5+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),10000);},600);
let lastHeart=0;document.addEventListener("mousemove",e=>{let now=Date.now();if(now-lastHeart<150)return;lastHeart=now;let h=document.createElement("div");h.className="heart";h.innerHTML="❤️";h.style.left=e.clientX+"px";h.style.top=e.clientY+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),1500);});
function openLightbox(src){document.getElementById("lightboxImg").src=src;document.getElementById("lightbox").style.display="flex";}
function closeLightbox(){document.getElementById("lightbox").style.display="none";}
function startExperience(){document.getElementById("overlay").style.display="none";document.querySelector(".card").style.display="block";if(!playing){music.play().catch(e=>{});playing=true;}}
const scrollElements=document.querySelectorAll(".card,.featured,.pic");const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("show");observer.unobserve(entry.target);}}},{threshold:0.2});scrollElements.forEach(el=>observer.observe(el));
const lyrics=[[1.0,3.0,"I don't wanna get lost"],[3.5,6.0,"inside the color"],[6.3,9.0,"under my tongue"],[10.7,14.9,"Cause I don't wanna\nbe in love with another"],[15.0,20.0,"even in another life"],[20.5,24.9,"Can someone tell me\nit's alright to be covered"],[25.0,29.0,"Underneath the covers?\nBut I"],[29.1,33.5,"No, I don't need to\nsleep anymore"]];
let lyricIndex=0
